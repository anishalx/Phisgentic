# Render Blueprint - Deploys both services automatically
# See: https://render.com/docs/blueprint-spec

services:
  # Backend API Server
  - type: web
    name: phishguard-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DISABLE_TESTER_AGENT
        value: "true"
      - key: GROQ_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard (for dual-model analysis)
      - key: DUAL_MODEL_ENABLED
        value: "true"

  # Next.js Web Dashboard
  - type: web
    name: phishguard-dashboard
    runtime: node
    region: oregon
    plan: free
    rootDir: web-dashboard
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Set manually in Render dashboard to https://phishguard-api.onrender.com
