<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhishGuard AI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="header">
        <div class="logo">
          <span class="logo-icon">🛡️</span>
          <span class="logo-text">PhishGuard AI</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="enabled-toggle" checked />
          <span class="slider"></span>
        </label>
      </header>

      <div class="status-section" id="status-section">
        <div class="status-card" id="status-card">
          <div class="status-icon" id="status-icon">⏳</div>
          <div class="status-text">
            <div class="status-title" id="status-title">Analyzing...</div>
            <div class="status-subtitle" id="status-subtitle">
              Checking current page
            </div>
          </div>
          <div class="status-score" id="status-score">--</div>
        </div>
      </div>

      <div class="details-section" id="details-section" style="display: none">
        <h3 class="section-title">Agent Analysis</h3>
        <div class="agents-list" id="agents-list"></div>
      </div>

      <div class="signals-section" id="signals-section" style="display: none">
        <h3 class="section-title">Detected Signals</h3>
        <div class="signals-list" id="signals-list"></div>
      </div>

      <div class="actions-section">
        <button class="action-btn" id="whitelist-btn">
          <span>✓</span> Whitelist Domain
        </button>
        <button class="action-btn" id="report-btn">
          <span>🚩</span> Report False Positive
        </button>
      </div>

      <div class="history-section">
        <h3 class="section-title">Recent Scans</h3>
        <div class="history-list" id="history-list">
          <div class="history-empty">No recent scans</div>
        </div>
      </div>

      <footer class="footer">
        <span>Powered by Groq AI</span>
        <a href="#" id="settings-link">Settings</a>
      </footer>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
